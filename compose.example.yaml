# Example stack for running the published images on a server (Dockge, Portainer,
# plain `docker compose` — anything that takes a compose file).
#
# This repo builds and pushes images; it does not run them. Copy this file into
# your stack directory on the server, put config.toml and proxies.txt next to it,
# and edit the mount paths below if you keep them somewhere else.
#
#   stack-dir/
#     compose.yaml     <- this file
#     config.toml      <- from monitor/config.example.toml, with your real URLs
#     proxies.txt      <- ip:port or ip:port:user:pass, one per line
#     .env             <- TLS_API_KEY=<anything>, read by compose below
#
# The monitor reads ./config.toml and ./proxies.txt relative to /app, and
# neither is baked into the image, so both mounts are required. A missing
# config.toml makes the container exit at startup with the path in the message.

services:
  monitor:
    image: ghcr.io/chewycrunch/woot-monitor/monitor:latest
    restart: unless-stopped
    depends_on:
      tls-client:
        condition: service_started
        restart: false
    environment:
      # Both containers share this network, so the sidecar is reachable by
      # service name. The image default (127.0.0.1:8080) is wrong here.
      WOOT_TLS_API_URL: http://tls-client:8080
      # Same value as the sidecar's API_AUTH_KEYS below — compose reads it from
      # ./.env so the shared secret is defined once.
      WOOT_TLS_API_KEY: ${TLS_API_KEY:?set TLS_API_KEY in .env}
      # Optional. Defaults to woot_monitor=info,offers=info.
      # RUST_LOG: woot_monitor=debug,offers=info,reqwest=warn
      # Optional. Set to json for one structured object per log line.
      # LOG_FORMAT: json
    volumes:
      # Both host paths must already exist. Docker silently creates a directory
      # at a missing bind-mount source, and a directory where the monitor wants
      # a file reads as an empty proxy list, not an error — so after a deploy,
      # check the startup log line for a non-zero proxy count.
      - ./config.toml:/app/config.toml:ro
      - ./proxies.txt:/app/proxies.txt:ro
    ports: []
    networks:
      - internal

  tls-client:
    image: ghcr.io/chewycrunch/woot-monitor/tls-client:latest
    restart: unless-stopped
    environment:
      # Replaces the key baked into the image rather than adding to it, so the
      # built-in default stops working once this is set.
      API_AUTH_KEYS: ${TLS_API_KEY:?set TLS_API_KEY in .env}
    # Otherwise unconfigured: the rest of config.dist.yml is baked in, and the
    # API is only reachable from the monitor — no ports published.
    ports: []
    networks:
      - internal

networks:
  internal:
    driver: bridge
