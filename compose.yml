services:
  monitor:
    build:
      context: ./monitor
      dockerfile: Dockerfile
      # Rust/musl cannot cross-compile here — each muslrust image only carries its
      # own arch's toolchain — so the non-native arch builds under emulation and is
      # slow. Publish from CI with a native runner per arch if that becomes painful.
      platforms:
        - linux/amd64
        - linux/arm64
    image: ghcr.io/chewycrunch/woot-monitor/monitor:latest

  tls-client:
    build:
      context: ./tls-client
      dockerfile: Dockerfile
      # Go cross-compiles, so both arches are cheap to build.
      platforms:
        - linux/amd64
        - linux/arm64
    image: ghcr.io/chewycrunch/woot-monitor/tls-client:latest
