# Copy this file to config.toml and fill in your own webhook URLs — config.toml
# is gitignored so your endpoints never reach the repo or a published image.
#
#   cp config.example.toml config.toml
#
# The monitor reads ./config.toml relative to its working directory (/app in the
# image) and refuses to start without it. See the README for how to mount it.

# `name` labels the entry in logs. Each may set any combination of the three
# URLs; omit one and that class of notification is not sent.
#
# verified and unverified are exclusive - every offer goes to exactly one.
# watchlist is independent and can fire alongside either.
[[webhooks]]
name = "all"

# Offers with an ASIN and at least 200 reviews.
verified_url = "https://discord.com/api/webhooks/000000000000000000/replace-me"
# Everything else, including offers whose details scrape came back empty.
unverified_url = "https://discord.com/api/webhooks/000000000000000000/replace-me"
# Offers matching the keywords or asins below, verified or not.
watchlist_url = "https://discord.com/api/webhooks/000000000000000000/replace-me"

# Matched case-insensitively against the offer title.
keywords = [
  "ninja",
  "irobot",
  "roomba",
  "keurig",
  "shark",
  "bissell",
  "dyson",
  "nest",
  "dji",
  "3070",
  "3080",
  "3090",
  "4060",
  "4070",
  "4080",
  "4090",
  "6700 xt",
  "6800 xt",
  "6900 xt",
  "7600 xt",
  "7700 xt",
  "7800 xt",
  "7900 xt",
  "9060 xt",
  "9070 xt",
  "9080 xt",
  "victrola",
  "instant pot",
  "evenflo",
  "dewalt",
  "milwaukee",
  "g.skill",
  "gskill",
]

# Exact ASIN matches, scraped from the offer page.
asins = [
  "B0BQSC4XNL",
]
