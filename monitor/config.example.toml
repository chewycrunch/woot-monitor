# Copy this file to config.toml and fill in your own webhook URLs — config.toml
# is gitignored so your endpoints never reach the repo or a published image.
#
#   cp config.example.toml config.toml
#
# The monitor reads ./config.toml relative to its working directory (/app in the
# image) and refuses to start without it. See the README for how to mount it.

# Woot's public AppSync key. Optional — the binary carries a working default and
# WOOT_GRAPHQL_API_KEY overrides both, so a rotation needs only a restart.
# graphql_api_key = "da2-..."

# `name` labels the entry in logs. Each may set any combination of the three
# URLs; omit one and that class of notification is not sent.
[[webhooks]]
name = "all"

# Every offer, including ones the monitor judges uninteresting.
junk_url = "https://discord.com/api/webhooks/000000000000000000/replace-me"
# Every real offer, before keyword/ASIN filtering.
unfiltered_url = "https://discord.com/api/webhooks/000000000000000000/replace-me"
# Only offers matching keywords or asins below.
filtered_url = "https://discord.com/api/webhooks/000000000000000000/replace-me"

# Matched case-insensitively against the offer title.
keywords = [
  "ninja",
  "irobot",
  "roomba",
  "keurig",
  "shark",
  "bissell",
  "dyson",
  "nest",
  "dji",
  "3070",
  "3080",
  "3090",
  "4060",
  "4070",
  "4080",
  "4090",
  "6700 xt",
  "6800 xt",
  "6900 xt",
  "7600 xt",
  "7700 xt",
  "7800 xt",
  "7900 xt",
  "9060 xt",
  "9070 xt",
  "9080 xt",
  "victrola",
  "instant pot",
  "evenflo",
  "dewalt",
  "milwaukee",
  "g.skill",
  "gskill",
]

# Exact ASIN matches, scraped from the offer page.
asins = [
  "B0BQSC4XNL",
]
