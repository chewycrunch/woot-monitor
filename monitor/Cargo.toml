[package]
name = "woot-monitor"
version = "1.5.0"
edition = "2021"

# Module files are named after the module (`webhook.rs` beside `webhook/`),
# never `mod.rs` — the style the Rust book calls idiomatic. Clippy ships the
# opposing `self_named_module_files` lint too; enabling one picks a side.
[lints.clippy]
mod_module_files = "warn"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.12.20", default-features = false, features = ["rustls-tls","json"] }
rand = "0.9.1"

tokio = { version = "1.53.1", features = ["full"] }
dotenvy = "0.15"
async-trait = "0.1.92"

chrono = { version = "0.4", features = ["serde"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
urlencoding = "2.1.3"
regex = "1.10"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter", "json"] }
