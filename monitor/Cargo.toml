[package]
name = "woot-monitor"
version = "1.3.17"
edition = "2021"

[[bin]]
name = "woot-monitor"
path = "src/bin/main.rs"


[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12.20", default-features = false, features = ["rustls-tls","json"] }
rand = "0.9.1"

tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
async-trait = "0.1"

chrono = { version = "0.4", features = ["serde"] }
serde_yaml = "0.9.34"
urlencoding = "2.1.3"
regex = "1.10"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter", "json"] }
